pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        // zhihulite 自建仓库：luajvm 引擎 + 定制 material
        // 临时使用本地 maven-repository 工作副本（调试期免推送，切回远程时还原此 URL）
        maven {
            name = 'zhihulite-releases'
            url = 'file:///D:/77/Documents/GitHub/maven-repository/repository/releases'
            content {
                includeGroup 'io.github.zhihulite'
                // 只拦 material 一个模块，其余 com.google.* 仍走 google()
                includeModule 'com.google.android.material', 'material'
            }
        }
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

include ':app'
rootProject.name = "Hydrogen"