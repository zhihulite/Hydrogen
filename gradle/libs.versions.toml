[versions]
glide = "5.0.9"
webviewup = "0.1.0"
agp = "9.3.2"
zxing-embedded = "4.3.0"
zxing-core = "3.5.4"
luajvm = "1.0.0"

[libraries]
# Third-party
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
webviewup-core = { group = "io.github.jonanorman.android.webviewup", name = "core", version.ref = "webviewup" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }

# luajvm 引擎（Lua 5.5.1 纯 Java 移植）
luajvm-core = { group = "io.github.zhihulite", name = "luajvm-core", version.ref = "luajvm" }
luajvm-android = { group = "io.github.zhihulite", name = "luajvm-android", version.ref = "luajvm" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }