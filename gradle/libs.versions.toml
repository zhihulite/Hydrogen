[versions]
appcompat = "1.8.0"
transition = "1.7.1"
fragment = "1.9.0"
viewpager2 = "1.1.0"
viewpager = "1.1.0"
recyclerview = "1.4.0"
swiperefresh = "1.2.0"
material = "1.14.0"
glide = "5.0.9"
photoview = "2.3.0"
webviewup = "0.1.0"
activity = "1.13.0"
agp = "9.3.2"
core = "1.19.0"
splashscreen = "1.2.0"
webkit = "1.17.0"
zxing-embedded = "4.3.0"
zxing-core = "3.5.4"
luajvm = "1.0.0"

[libraries]
# AndroidX
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-appcompat-resources = { group = "androidx.appcompat", name = "appcompat-resources", version.ref = "appcompat" }
androidx-transition = { group = "androidx.transition", name = "transition", version.ref = "transition" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-viewpager2 = { group = "androidx.viewpager2", name = "viewpager2", version.ref = "viewpager2" }
androidx-viewpager = { group = "androidx.viewpager", name = "viewpager", version.ref = "viewpager" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-swiperefresh = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefresh" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "core"}
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }

# Google
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Third-party
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
photoview = { module = "com.github.Baseflow:PhotoView", version.ref = "photoview" }
webviewup-core = { group = "io.github.jonanorman.android.webviewup", name = "core", version.ref = "webviewup" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }

# Activity
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }

# luajvm 引擎（Lua 5.5.1 纯 Java 移植）
luajvm-core = { group = "io.github.zhihulite", name = "luajvm-core", version.ref = "luajvm" }
luajvm-android = { group = "io.github.zhihulite", name = "luajvm-android", version.ref = "luajvm" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }