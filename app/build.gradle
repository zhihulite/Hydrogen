plugins {
    alias(libs.plugins.android.application)
}

// 为所有 Java 编译任务启用废弃 API 检测，编译时会在控制台输出使用了废弃 API 的具体位置
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}

android {
    namespace 'com.zhihu.hydrogen.x'
    compileSdk 37

    defaultConfig {
        applicationId "com.zhihu.hydrogen.x"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "new"
        resourceConfigurations += ['zh']
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/hydrogen.jks")
            storePassword "zhihu"
            keyAlias "hydrogen"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        debug {
            storeFile file("${rootDir}/hydrogen.jks")
            storePassword "zhihu"
            keyAlias "hydrogen"
            keyPassword "android"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 必须要禁用 R8
            minifyEnabled false
            //noinspection NotShrinkingResources
            shrinkResources false
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
        debug {
            signingConfig signingConfigs.debug
            // 必须要禁用 R8
            minifyEnabled false
            //noinspection NotShrinkingResources
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError false       // 即使报错也不中断构建
        checkReleaseBuilds  true  // Release 时运行检查
        textReport true          // 控制台显示报告
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // luajvm 引擎：AAR 已 api 依赖 luajvm-core，故 core 随之进入编译期
    implementation libs.luajvm.android
    implementation libs.androidx.appcompat
    implementation libs.androidx.appcompat.resources
    implementation libs.androidx.core
    implementation libs.androidx.transition
    implementation libs.androidx.fragment
    implementation libs.androidx.viewpager2
    implementation libs.androidx.viewpager
    implementation libs.androidx.recyclerview
    implementation libs.androidx.swiperefresh
    implementation libs.glide
    annotationProcessor libs.glide.compiler
    implementation libs.photoview
    implementation libs.webviewup.core
    implementation libs.androidx.activity
    implementation libs.androidx.splashscreen
    implementation libs.androidx.webkit
    implementation libs.zxing.embedded
    implementation libs.zxing.core

    // M3 规范组件库支持：https://github.com/zhihulite/material-components-android
    implementation libs.material
    implementation fileTree("libs")
}

// 从 app 模块的 assets/core/app_info.lua 读取版本号
def getAppVersion() {
    def coreVersion = "unknown"
    def appInfoFile = file("src/main/assets/core/app_info.lua")
    if (appInfoFile.exists()) {
        try {
            def text = appInfoFile.getText('UTF-8')
            // 匹配 M.version = 0.1
            def matcher = text =~ /M\.version\s*=\s*([\d.]+)/
            if (matcher.find()) {
                coreVersion = matcher.group(1)
            }
        } catch (Exception e) {
            println "WARNING: 无法读取 app_info.lua: ${e.message}"
        }
    }
    return coreVersion
}

// APK 命名：只根据 assets/core/app_info.lua 的 M.version 重命名（不再拼接 gradle versionName）
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def coreVer = getAppVersion()
            def newName = "Hydrogen_${coreVer}.apk"
            output.outputFileName.set(newName)
        }
    }
}
// ── Lua 打包模式：-PluaMode=lua | luac ───────────────────────────────────
//   lua   ：只打 .lua 源码。debug 构建的默认。
//   luac  ：先把 assets 下的 .lua 预编译成同名 .luac，再把 .lua 排除出包 —— 只打字节码。
//           release 构建的默认（正式版用字节码：冷启动免编译，包体减半）。
//           运行期 BaseLib.loadFile 优先读同名 .luac，`require` 走 package.path 的
//           ?.luac 模板；字节码里带原始 source 名，故 traceback 与走源码一致。
//           显式 -PluaMode=... 可对任一构建类型覆盖默认。
//
// 【不要加 --strip】实测会让运行期错误从 `foo.lua:8: ... (local 't')` 退化成
//   `foo.lua:0: ...`（行号与变量名双失）。
//
// 【切回 lua 模式前先 cleanLuaAssets】.luac 是构建产物却就地生成在 src/main/assets
//   下（运行期靠"同名兄弟文件"定位），残留会被下一次构建打进包里。
// luac 编译器随 luajvm-core 制品分发；单独取一份 configuration 是因为它只在
// 构建期跑，不该进 APK 的任何 classpath。
configurations {
    luacTool
}

dependencies {
    luacTool libs.luajvm.core
}

tasks.register('precompileLuaAssets', JavaExec) {
    group = 'build'
    description = '把 app/src/main/assets 下的 .lua 预编译为同名 .luac（加速冷启动）。'
    classpath = configurations.luacTool
    mainClass.set('org.luajvm.tools.LuacCompiler')
    // --keep-going：个别文件可能依赖特殊环境而编译失败，不应阻断整个构建
    args file('src/main/assets').absolutePath, '--keep-going'
}

tasks.register('cleanLuaAssets', Delete) {
    group = 'build'
    description = '删除 assets 下所有 .luac（回到纯源码状态）。'
    delete fileTree('src/main/assets') { include '**/*.luac' }
}

// 默认按构建类型分流：debug 源码（可调试、可热改），release 字节码；
// -PluaMode=lua|luac 显式指定时对两者统一覆盖。
def explicitMode = project.findProperty('luaMode')?.toString()
def luaMode = explicitMode ?: (gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
} ? 'luac' : 'lua')
if (!(luaMode in ['lua', 'luac'])) {
    throw new GradleException("-PluaMode 只接受 lua 或 luac，收到：'${luaMode}'")
}

if (luaMode == 'luac') {
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
        dependsOn 'precompileLuaAssets'
        // 打包任务一结束就清掉就地生成的 .luac：它们已进 APK，留在 assets 里只会
        //   被下一次构建误打包（ignoreAssetsPatterns 只排除 .lua，不排 .luac）
        finalizedBy 'cleanLuaAssets'
    }
    // .luac 就位后 .lua 在包里纯属重复，排除以减半 assets 体积与首装解包字节数
    android.androidResources.ignoreAssetsPatterns.add('*.lua')
}
